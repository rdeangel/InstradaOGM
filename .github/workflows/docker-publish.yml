name: Docker Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom tag name (optional, defaults to branch name)'
        required: false
        type: string
  push:
    branches:
      - 'security/**'
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'preview/**'

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '23'

      - name: Get version from package.json
        id: package-version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Lowercase repository owner
        id: repo-owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Determine Docker tags and registries
        id: tags
        env:
          VERSION: ${{ steps.package-version.outputs.VERSION }}
          OWNER: ${{ steps.repo-owner.outputs.OWNER }}
          RAW_REF: ${{ github.event.inputs.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          # Clean branch name for tag (e.g. security/v2.0.1 -> security-v2.0.1)
          SLUG_REF=$(echo "${RAW_REF}" | tr '/' '-' | tr -cd '[:alnum:]-_.')
          
          POSTGRES_TAGS=""
          SQLITE_TAGS=""
          
          if [[ "${EVENT_NAME}" == "release" ]]; then
            # Official Release: publish to both GHCR and Docker Hub
            POSTGRES_TAGS="ghcr.io/${OWNER}/instrada-ogm-postgres:${VERSION}
          ghcr.io/${OWNER}/instrada-ogm-postgres:latest"
            SQLITE_TAGS="ghcr.io/${OWNER}/instrada-ogm-sqlite:${VERSION}
          ghcr.io/${OWNER}/instrada-ogm-sqlite:latest"
            
            if [[ -n "${DOCKER_USERNAME}" ]]; then
              POSTGRES_TAGS="${POSTGRES_TAGS}
          ${DOCKER_USERNAME}/instrada-ogm-postgres:${VERSION}
          ${DOCKER_USERNAME}/instrada-ogm-postgres:latest"
              SQLITE_TAGS="${SQLITE_TAGS}
          ${DOCKER_USERNAME}/instrada-ogm-sqlite:${VERSION}
          ${DOCKER_USERNAME}/instrada-ogm-sqlite:latest"
            fi
          else
            # Branch / test build: Push ONLY to GHCR under -dev package name, NO Docker Hub
            POSTGRES_TAGS="ghcr.io/${OWNER}/instrada-ogm-postgres-dev:${SLUG_REF}
          ghcr.io/${OWNER}/instrada-ogm-postgres-dev:${SLUG_REF}-${SHORT_SHA}"
            SQLITE_TAGS="ghcr.io/${OWNER}/instrada-ogm-sqlite-dev:${SLUG_REF}
          ghcr.io/${OWNER}/instrada-ogm-sqlite-dev:${SLUG_REF}-${SHORT_SHA}"
          fi
          
          {
            echo "postgres<<EOF"
            echo "${POSTGRES_TAGS}"
            echo "EOF"
            echo "sqlite<<EOF"
            echo "${SQLITE_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Only log into Docker Hub for official published releases
      - name: Log into Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Always log into GitHub Container Registry (ghcr.io)
      - name: Log into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Postgres Image
      - name: Build and push Postgres Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.postgres }}
          build-args: |
            PRISMA_SCHEMA_FILE=schema.postgres.prisma
            PRISMA_MIGRATIONS_DIR=migrations-postgres
            DATABASE_URL=postgresql://user:password@localhost:5432/InstradaOGM_build?schema=public
            APP_DEBUG_LEVEL=SILENT
            NEXT_PUBLIC_APP_VERSION=${{ steps.package-version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push SQLite Image
      - name: Build and push SQLite Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.sqlite }}
          build-args: |
            PRISMA_SCHEMA_FILE=schema.sqlite.prisma
            PRISMA_MIGRATIONS_DIR=migrations-sqlite
            DATABASE_URL=file:/app/data/db/dev.db
            APP_DEBUG_LEVEL=SILENT
            NEXT_PUBLIC_APP_VERSION=${{ steps.package-version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

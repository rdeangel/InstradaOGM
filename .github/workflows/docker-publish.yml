name: Docker Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '23'

      - name: Get version from package.json
        id: package-version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Lowercase repository owner
        id: repo-owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log into GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Postgres Image
      - name: Build and push Postgres Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/instrada-ogm-postgres:${{ steps.package-version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/instrada-ogm-postgres:latest
            ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/instrada-ogm-postgres:${{ steps.package-version.outputs.VERSION }}
            ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/instrada-ogm-postgres:latest
          build-args: |
            PRISMA_SCHEMA_FILE=schema.postgres.prisma
            PRISMA_MIGRATIONS_DIR=migrations-postgres
            DATABASE_URL=postgresql://user:password@localhost:5432/InstradaOGM_build?schema=public
            APP_DEBUG_LEVEL=SILENT
            NEXT_PUBLIC_APP_VERSION=${{ steps.package-version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push SQLite Image
      - name: Build and push SQLite Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/instrada-ogm-sqlite:${{ steps.package-version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/instrada-ogm-sqlite:latest
            ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/instrada-ogm-sqlite:${{ steps.package-version.outputs.VERSION }}
            ghcr.io/${{ steps.repo-owner.outputs.OWNER }}/instrada-ogm-sqlite:latest
          build-args: |
            PRISMA_SCHEMA_FILE=schema.sqlite.prisma
            PRISMA_MIGRATIONS_DIR=migrations-sqlite
            DATABASE_URL=file:/app/data/db/dev.db
            APP_DEBUG_LEVEL=SILENT
            NEXT_PUBLIC_APP_VERSION=${{ steps.package-version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

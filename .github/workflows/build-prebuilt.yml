name: Build Pre-built Packages

# When to run this workflow
on:
  # Trigger when a new release is published
  release:
    types: [published]
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish to release (optional; leave empty for artifact-only test build)'
        required: false
        type: string

  # Build on push to branches for test package artifacts
  push:
    branches:
      - 'security/**'
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - 'fix/**'
      - 'preview/**'

# Permissions required for creating releases / downloading code
permissions:
  contents: read

# Define the jobs to run
jobs:
  # Build matrix for native amd64 builds
  build-amd64:
    name: Build ${{ matrix.db_type }} (amd64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db_type: [sqlite, postgres]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      
      - name: Switch to ${{ matrix.db_type }} schema
        run: npm run db:switch:${{ matrix.db_type }}
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Build
        run: npm run build
      
      - name: Create Pre-built Package
        # We run this immediately after build while .next/static and .next/server are present.
        # This ensures the packaging script can include all necessary assets.
        run: |
          chmod +x scripts/create-prebuilt-package.sh
          ./scripts/create-prebuilt-package.sh amd64 ${{ matrix.db_type }}
      
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.db_type }}-amd64
          path: dist/*.tar.gz
          retention-days: 14

  # Build matrix for arm64 builds via QEMU emulation
  build-arm64:
    name: Build ${{ matrix.db_type }} (arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db_type: [sqlite, postgres]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      
      - name: Build and Package (arm64)
        # We build and package in the same step while all files are present on the runner.
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/app \
            -w /app \
            node:24-slim \
            bash -c "
              apt-get update && apt-get install -y python3 make g++ git && \
              npm run db:switch:${{ matrix.db_type }} && \
              npm install && \
              npx prisma generate && \
              npm run build && \
              chmod +x scripts/create-prebuilt-package.sh && \
              ./scripts/create-prebuilt-package.sh arm64 ${{ matrix.db_type }}
            "
      
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.db_type }}-arm64
          path: dist/*.tar.gz
          retention-days: 14

  # Publish all packages to the release (only runs on official release or when version input is provided)
  publish-release:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    permissions:
      contents: write
    
    steps:
      - name: Download all packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          pattern: package-*
          merge-multiple: true
      
      - name: List packages
        run: ls -la dist/
      
      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.tar.gz
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
